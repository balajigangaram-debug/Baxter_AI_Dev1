[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "baxter-tcs-ai-transformation"
version = "0.1.0"
description = "Configurable starter for enterprise ITSM AI workflows and knowledge graph patterns."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.35"]
graph = ["neo4j>=5.26"]
analytics = ["pandas>=2.2", "pyspark>=3.5"]
orchestration = ["langgraph>=0.2"]
evaluation = ["ragas>=0.2"]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]
all = ["boto3>=1.35", "neo4j>=5.26", "pandas>=2.2", "pyspark>=3.5", "langgraph>=0.2", "ragas>=0.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/baxter_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
