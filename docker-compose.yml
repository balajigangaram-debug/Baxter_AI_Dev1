services:
  app:
    build: .
    env_file: .env
    depends_on:
      neo4j:
        condition: service_healthy
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_PASSWORD:-change-me} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  neo4j-data:
